<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>flowgen — live editor</title>

  <!--
    Tailwind Play CDN, scoped to cheatsheet previews.
    Preflight is disabled so Tailwind's default reset doesn't clobber the
    editor's own UI (buttons, h1/h2, list margins). Utility classes still
    work, which is all we need for the inline component previews.
  -->
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = { corePlugins: { preflight: false } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #f5f5f4;          /* stone-100 */
      --bg-pane: #ffffff;
      --bg-toolbar: #1c1917;  /* stone-900 */
      --fg: #1c1917;
      --fg-muted: #78716c;    /* stone-500 */
      --border: #d6d3d1;      /* stone-300 */
      --accent: #0c0a09;
      --ok: #059669;
      --warn: #b45309;
      --err: #dc2626;
      --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Toolbar */
    .toolbar {
      background: var(--bg-toolbar);
      color: white;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      border-bottom: 3px solid var(--accent);
    }
    .toolbar .brand {
      font-weight: 700;
      letter-spacing: 0.2em;
      font-size: 11px;
      text-transform: uppercase;
    }
    .toolbar .spacer { flex: 1; }
    .toolbar button,
    .toolbar label.file-button {
      background: transparent;
      color: white;
      border: 1px solid #57534e;
      padding: 4px 10px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 600;
    }
    .toolbar button:hover,
    .toolbar label.file-button:hover {
      background: #292524;
      border-color: white;
    }
    .toolbar input[type="file"] { display: none; }
    .toolbar .status {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1px solid;
      font-weight: 600;
    }
    .toolbar .status[data-kind="ok"]   { color: var(--ok);   border-color: var(--ok);   }
    .toolbar .status[data-kind="warn"] { color: var(--warn); border-color: var(--warn); }
    .toolbar .status[data-kind="error"]{ color: var(--err);  border-color: var(--err);  }

    /* Main split */
    .split {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      min-height: 0;
    }
    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg-pane);
    }
    .pane + .pane { border-left: 1px solid var(--border); }
    .pane-header {
      padding: 6px 14px;
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--fg-muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      font-weight: 700;
    }
    .pane-body {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    /* Source editor */
    textarea#source {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      resize: none;
      padding: 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      color: var(--fg);
      background: var(--bg-pane);
      tab-size: 2;
      white-space: pre;
    }

    /* Preview iframe */
    iframe#preview {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }

    /* Issues panel */
    .issues-pane {
      flex-shrink: 0;
      max-height: 30vh;
      overflow: auto;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .issues-pane:empty { display: none; }
    .issue {
      font-size: 11px;
      padding: 4px 14px;
      border-left: 3px solid transparent;
      font-family: var(--mono);
    }
    .issue.warning { border-left-color: var(--warn); background: #fffbeb; color: #78350f; }
    .issue.error,
    .issue.fatal { border-left-color: var(--err); background: #fef2f2; color: #7f1d1d; }
    .issue code {
      background: rgba(0,0,0,0.05);
      padding: 0 4px;
      border-radius: 2px;
    }

    /* Cheatsheet modal */
    #cheatsheet {
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.55);
      display: none;
      align-items: stretch;
      justify-content: center;
      z-index: 50;
      padding: 32px;
    }
    #cheatsheet.open { display: flex; }
    .modal-card {
      background: var(--bg-pane);
      border: 2px solid var(--accent);
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      background: var(--bg-toolbar);
      color: white;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 3px solid var(--accent);
    }
    .modal-head .title {
      font-weight: 700;
      letter-spacing: 0.25em;
      font-size: 11px;
      text-transform: uppercase;
    }
    .modal-head .spacer { flex: 1; }
    .modal-head .close {
      background: transparent;
      color: white;
      border: 1px solid #57534e;
      padding: 4px 10px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 600;
    }
    .modal-head .close:hover { background: #292524; border-color: white; }
    .modal-body {
      overflow-y: auto;
      padding: 22px 26px;
      font-size: 12px;
      color: var(--fg);
      line-height: 1.55;
    }
    .cs-section {
      margin-bottom: 28px;
    }
    .cs-section h2 {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin: 0 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }
    .cs-section p {
      margin: 6px 0 12px;
      color: #44403c;
    }
    .cs-icon-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }
    .cs-icon-row .icon-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 11px;
    }
    .cs-icon-row .icon-chip code {
      font-weight: 600;
      color: var(--accent);
      background: transparent;
    }
    .cs-snippet {
      margin: 6px 0 14px;
      border: 1px solid var(--border);
      background: #fafaf9;
      position: relative;
    }
    .cs-snippet .label {
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--fg-muted);
      padding: 4px 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cs-snippet .label .desc {
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: none;
      color: var(--fg-muted);
    }
    .cs-snippet .label .spacer { flex: 1; }
    .cs-snippet pre {
      margin: 0;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.55;
      overflow-x: auto;
      white-space: pre;
      color: var(--fg);
    }
    .cs-snippet button.copy {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 2px 8px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 600;
    }
    .cs-snippet button.copy:hover {
      background: var(--accent);
      color: white;
    }
    .cs-snippet button.copy[data-state="copied"] {
      background: var(--ok);
      color: white;
      border-color: var(--ok);
    }
    .cs-preview {
      background: var(--bg);
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      overflow: auto;
    }
    .cs-preview:empty { display: none; }
    .cs-preview-label {
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--fg-muted);
      font-weight: 700;
      margin-bottom: 8px;
    }
    /* The previews render real components which set their own colors via
       inline styles, but a few stone-* utility classes need an explicit
       fallback in case Tailwind hasn't finished JIT-compiling. These match
       Tailwind's defaults. */
    .cs-preview .text-stone-900 { color: #1c1917; }
    .cs-preview .text-stone-700 { color: #44403c; }
    .cs-preview .text-stone-600 { color: #57534e; }
    .cs-preview .text-stone-500 { color: #78716c; }
    .cs-preview .bg-white { background-color: #ffffff; }
    .cs-color-refs code {
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 2px;
      font-family: var(--mono);
      font-size: 11px;
    }

    /* Drag-drop overlay */
    #dropzone {
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.85);
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 700;
      pointer-events: none;
      z-index: 100;
    }
    #dropzone.active { display: flex; }
    #dropzone .inner {
      border: 3px dashed white;
      padding: 40px 60px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="brand">FLOWGEN · LIVE EDITOR</span>
    <label class="file-button" for="load">Load .md</label>
    <input id="load" type="file" accept=".md,.markdown,text/markdown" />
    <button id="download" type="button">Download HTML</button>
    <button id="cheatsheet-open" type="button">Components ↗</button>
    <span class="spacer"></span>
    <span id="status" class="status" data-kind="ok">clean</span>
  </div>

  <div class="split">
    <div class="pane">
      <div class="pane-header">Source · YAML in markdown</div>
      <div class="pane-body">
        <textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
    </div>
    <div class="pane">
      <div class="pane-header">Preview</div>
      <div class="pane-body">
        <iframe id="preview" title="Flowchart preview"></iframe>
      </div>
    </div>
  </div>

  <div id="issues" class="issues-pane"></div>

  <div id="dropzone">
    <div class="inner">Drop .md file to load</div>
  </div>

  <div id="cheatsheet">
    <div class="modal-card">
      <div class="modal-head">
        <span class="title">Component reference</span>
        <span class="spacer"></span>
        <button class="close" id="cheatsheet-close" type="button">Close</button>
      </div>
      <div class="modal-body" id="cheatsheet-body"></div>
    </div>
  </div>

  <script src="editor.bundle.js"></script>
</body>
</html>
